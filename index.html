<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #121212; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 10px; 
            width: 85%; 
            max-width: 350px; 
            text-align: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }
        h2 { 
            color: #00e676; 
            margin-bottom: 20px; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: none; 
            border-radius: 5px; 
            background: #2c2c2c; 
            color: #fff; 
            box-sizing: border-box; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #00e676; 
            border: none; 
            color: #000; 
            font-weight: bold; 
            border-radius: 5px; 
            margin-top: 15px; 
            cursor: pointer; 
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .toggle { 
            color: #888; 
            font-size: 14px; 
            margin-top: 15px; 
            cursor: pointer; 
            text-decoration: underline; 
        }
        #msg { 
            margin-top: 15px; 
            font-size: 14px; 
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="card">
    <h2 id="title">Login වන්න</h2>
    <input type="email" id="email" placeholder="Email ලිපිනය">
    <input type="password" id="password" placeholder="මුරපදය (Password)">
    <button id="btn" onclick="handleSubmit()">ඇතුළු වන්න</button>
    
    <div class="toggle" onclick="toggleMode()" id="toggleBtn">ගිණුමක් නැද්ද? Register වන්න</div>
    <div id="msg"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "project-7974004196672383534.firebaseapp.com",
    projectId: "project-7974004196672383534",
    storageBucket: "project-7974004196672383534.firebasestorage.app",
    messagingSenderId: "635003004594",
    appId: "1:635003004594:web:98361476c6bca7a691cbab",
    measurementId: "G-7QDP5TC3HW"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  let isLogin = true;

  const title = document.getElementById('title');
  const btn = document.getElementById('btn');
  const toggleBtn = document.getElementById('toggleBtn');
  const msg = document.getElementById('msg');

  function friendlyError(code) {
    const map = {
      "auth/invalid-email": "වලංගු Email ලිපිනයක් ඇතුළත් කරන්න.",
      "auth/user-not-found": "මේ Email එකට ගිණුමක් නැහැ.",
      "auth/wrong-password": "Password එක වැරදියි.",
      "auth/invalid-credential": "Email එක හෝ Password එක වැරදියි.",
      "auth/email-already-in-use": "මේ Email එකට දැනටමත් ගිණුමක් තියෙනවා.",
      "auth/weak-password": "Password එකේ අකුරු 6ක්වත් තිබිය යුතුයි.",
      "auth/too-many-requests": "උත්සාහයන් වැඩියි, ටිකක් පස්සේ try කරන්න."
    };
    return map[code] || "දෝෂයක් ඇතිවුණා. නැවත උත්සාහ කරන්න.";
  }

  toggleBtn.addEventListener('click', () => {
    isLogin = !isLogin;
    title.innerText = isLogin ? "Login වන්න" : "Register වන්න";
    btn.innerText = isLogin ? "ඇතුළු වන්න" : "Register වන්න";
    toggleBtn.innerText = isLogin ? "ගිණුමක් නැද්ද? Register වන්න" : "ගිණුමක් තියෙනවද? Login වන්න";
    msg.innerText = "";
  });

  btn.addEventListener('click', () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!email || !password) {
      msg.style.color = "orange";
      msg.innerText = "සියලු විස්තර ඇතුළත් කරන්න!";
      return;
    }

    btn.disabled = true;
    msg.style.color = "#aaa";
    msg.innerText = "පරීක්ෂා කරමින්...";

    if (isLogin) {
      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          msg.style.color = "#00e676";
          msg.innerText = "සාර්ථකව Login වුණා! 🎉";
          setTimeout(() => {
            window.location.href = "home.html";
          }, 1000);
        })
        .catch(err => {
          msg.style.color = "red";
          msg.innerText = friendlyError(err.code);
        })
        .finally(() => { btn.disabled = false; });
    } else {
      createUserWithEmailAndPassword(auth, email, password)
        .then(() => {
          msg.style.color = "#00e676";
          msg.innerText = "ගිණුම සාර්ථකව සෑදුවා! දැන් Login වන්න. 🎉";
          toggleBtn.click();
        })
        .catch(err => {
          msg.style.color = "red";
          msg.innerText = friendlyError(err.code);
        })
        .finally(() => { btn.disabled = false; });
    }
  });
</script>


</body>
</html>
