<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
  // ඔබේ Firebase Config එක මෙතැනට තබන්න
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  // Firebase Initialize කිරීම
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  const auth = firebase.auth();

  // Error Messages සිංහලට හැරවීමේ ශ්‍රිතය
  function getErrorMessage(errorCode) {
    switch (errorCode) {
      case 'auth/email-already-in-use':
        return 'මෙම Email එක දැනටමත් ගිණුමකට සම්බන්ධ කර ඇත.';
      case 'auth/invalid-email':
        return 'නිවැරදි Email ලිපිනයක් ඇතුළත් කරන්න.';
      case 'auth/weak-password':
        return 'මුරපදයට අවම වශයෙන් අකුරු/ඉලක්කම් 6ක් ඇතුළත් කරන්න.';
      case 'auth/user-not-found':
      case 'auth/wrong-password':
      case 'auth/invalid-credential':
        return 'Email එක හෝ මුරපදය වැරදියි.';
      case 'auth/network-request-failed':
        return 'ඉන්ටර්නෙට් සම්බන්ධතාවය පරීක්ෂා කරන්න.';
      default:
        return 'දෝෂයක් සිදු විය: ' + errorCode;
    }
  }

  // Register වීමේ ශ්‍රිතය
  function handleRegister(email, password, messageElement) {
    auth.createUserWithEmailAndPassword(email, password)
      .then((userCredential) => {
        messageElement.style.color = "green";
        messageElement.innerText = "ලියාපදිංචිය සාර්ථකයි! ඇතුළු වෙමින්...";
        setTimeout(() => {
          window.location.href = "home.html";
        }, 1500);
      })
      .catch((error) => {
        messageElement.style.color = "red";
        messageElement.innerText = getErrorMessage(error.code);
      });
  }

  // Login වීමේ ශ්‍රිතය
  function handleLogin(email, password, messageElement) {
    auth.signInWithEmailAndPassword(email, password)
      .then((userCredential) => {
        messageElement.style.color = "green";
        messageElement.innerText = "ඇතුළුවීම සාර්ථකයි!";
        setTimeout(() => {
          window.location.href = "home.html";
        }, 1000);
      })
      .catch((error) => {
        messageElement.style.color = "red";
        messageElement.innerText = getErrorMessage(error.code);
      });
  }
</script>
