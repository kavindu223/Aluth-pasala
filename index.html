<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 300px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    h2 { color: #00ff88; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #333; background: #2b2b2b; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 6px; background: #00ff88; color: black; font-weight: bold; cursor: pointer; }
    .toggle { margin-top: 15px; font-size: 14px; cursor: pointer; color: #aaa; text-decoration: underline; }
    #msg { margin-top: 15px; font-size: 14px; word-wrap: break-word; }
  </style>
</head>
<body>

<div class="card">
  <h2 id="title">Register වන්න</h2>
  <input type="email" id="email" placeholder="Email ලිපිනය">
  <input type="password" id="password" placeholder="මුරපදය (අවම 6යි)">
  <button id="btn" onclick="handleSubmit()">Register වන්න</button>
  <div class="toggle" onclick="toggleMode()" id="toggleBtn">ගිණුමක් තියෙනවද? Login වන්න</div>
  <div id="msg"></div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
  // ඔයාගේ සියලුම නිවැරදි Firebase credentials
  const firebaseConfig = {
    apiKey: "AIzaSyC_zzKyChOeDSJ3HKr_5K6Spx-g5P7l9tI",
    authDomain: "project-7974004196672383534.firebaseapp.com",
    projectId: "project-7974004196672383534",
    storageBucket: "project-7974004196672383534.firebasestorage.app",
    messagingSenderId: "635003004594",
    appId: "1:635003004594:web:98361476c6bca7a691cbab",
    measurementId: "G-7QDP5TC3HW"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  let isRegisterMode = true;

  function toggleMode() {
    isRegisterMode = !isRegisterMode;
    document.getElementById("title").innerText = isRegisterMode ? "Register වන්න" : "Login වන්න";
    document.getElementById("btn").innerText = isRegisterMode ? "Register වන්න" : "ඇතුළු වන්න";
    document.getElementById("toggleBtn").innerText = isRegisterMode ? "ගිණුමක් තියෙනවද? Login වන්න" : "ගිණුමක් නැද්ද? Register වන්න";
    document.getElementById("msg").innerText = "";
  }

  function handleSubmit() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");

    if (!email || !password) {
      msg.style.color = "red";
      msg.innerText = "Email සහ Password දෙකම ඇතුළත් කරන්න.";
      return;
    }

    msg.style.color = "yellow";
    msg.innerText = "සූදානම් වෙමින් පවතී...";

    if (isRegisterMode) {
      firebase.auth().createUserWithEmailAndPassword(email, password)
        .then(() => {
          msg.style.color = "#00ff88";
          msg.innerText = "ලියාපදිංචිය සාර්ථකයි! ඇතුළු වෙමින්...";
          setTimeout(() => { window.location.href = "home.html"; }, 1500);
        })
        .catch((error) => {
          msg.style.color = "red";
          msg.innerText = "දෝෂයයි: " + error.message;
        });
    } else {
      firebase.auth().signInWithEmailAndPassword(email, password)
        .then(() => {
          msg.style.color = "#00ff88";
          msg.innerText = "ඇතුළුවීම සාර්ථකයි!";
          setTimeout(() => { window.location.href = "home.html"; }, 1000);
        })
        .catch((error) => {
          msg.style.color = "red";
          msg.innerText = "දෝෂයයි: " + error.message;
        });
    }
  }
</script>

</body>
</html>
