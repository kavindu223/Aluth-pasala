<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>සිංහල හෝඩිය - පෙරපාසල</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', sans-serif; }
        
        body {
            background-color: #0f172a; color: #fff; padding: 20px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://img.freepik.com/free-vector/watercolor-floral-pattern-background_23-2148102434.jpg');
            background-size: cover; opacity: 0.15; z-index: -1; pointer-events: none;
        }

        header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: #00e676; font-size: 2rem; }
        .back-btn { background: #334155; color: #fff; padding: 8px 15px; border-radius: 10px; text-decoration: none; }

        .letter-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px; width: 100%; max-width: 800px;
        }

        .letter-card {
            background: linear-gradient(135deg, #1e293b, #334155);
            border: 3px solid #ff007f; border-radius: 20px; padding: 15px;
            text-align: center; cursor: pointer; transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .letter-card:active { transform: scale(0.95); }
        .letter { font-size: 2.5rem; color: #38bdf8; font-weight: bold; }
        .word { font-size: 0.9rem; color: #f1f5f9; margin-top: 5px; }

        .loading {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; font-size: 1.2rem; color: #94a3b8;
        }
        .hidden { display: none; }

        .no-voice-msg {
            margin-top: 15px; color: #f87171; font-size: 0.85rem; text-align: center; display: none;
        }
    </style>
</head>
<body>

    <div id="loadingScreen" class="loading">පූරණය වෙමින්...</div>

    <div id="pageContent" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center;">

        <header>
            <h1>🗣️ කතා කරන සිංහල හෝඩිය</h1>
            <a href="sinhala_pre.html" class="back-btn">⬅ ආපසු</a>
        </header>

        <div class="letter-grid">
            <div class="letter-card" onclick="speak('අ, අලියා')">
                <div class="letter">අ</div>
                <div class="word">🐘 අලියා</div>
            </div>
            <div class="letter-card" onclick="speak('ආ, ආප්ප')">
                <div class="letter">ආ</div>
                <div class="word">🍲 ආප්ප</div>
            </div>
            <div class="letter-card" onclick="speak('ඇ, ඇට')">
                <div class="letter">ඇ</div>
                <div class="word">🌰 ඇට</div>
            </div>
            <div class="letter-card" onclick="speak('ඉ, ඉර')">
                <div class="letter">ඉ</div>
                <div class="word">☀️ ඉර</div>
            </div>
            <div class="letter-card" onclick="speak('ඊ, ඊතලය')">
                <div class="letter">ඊ</div>
                <div class="word">🏹 ඊතලය</div>
            </div>
            <div class="letter-card" onclick="speak('උ, උඩවැඩියා')">
                <div class="letter">උ</div>
                <div class="word">🌸 උඩවැඩියා</div>
            </div>
            <div class="letter-card" onclick="speak('එ, එළදෙන')">
                <div class="letter">එ</div>
                <div class="word">🐄 එළදෙන</div>
            </div>
            <div class="letter-card" onclick="speak('ඔ, ඔරලෝසුව')">
                <div class="letter">ඔ</div>
                <div class="word">⏰ ඔරලෝසුව</div>
            </div>
        </div>

        <p class="no-voice-msg" id="noVoiceMsg">ඔබගේ device එකේ සිංහල හඬ නොමැත. Text එක උඩින්ම කියවන්න. 🙂</p>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_zzKyChOeDSJGmhd8j2clhGf0nXqdv4g",
            authDomain: "project-7974004196672383534.firebaseapp.com",
            projectId: "project-7974004196672383534",
            storageBucket: "project-7974004196672383534.firebasestorage.app",
            messagingSenderId: "635003004594",
            appId: "1:635003004594:web:98361476c6bca7a691cbab",
            measurementId: "G-7QDP5TC3HW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('pageContent').classList.remove('hidden');
            } else {
                window.location.href = "index.html";
            }
        });
    </script>

    <script>
        function speak(text) {
            if ('speechSynthesis' in window) {
                var voices = window.speechSynthesis.getVoices();
                var hasSinhala = voices.some(v => v.lang === 'si-LK' || v.lang.startsWith('si'));

                var speech = new SpeechSynthesisUtterance();
                speech.text = text;
                speech.lang = 'si-LK';
                speech.pitch = 1.3;
                speech.rate = 0.85;

                if (!hasSinhala) {
                    document.getElementById('noVoiceMsg').style.display = 'block';
                }

                window.speechSynthesis.speak(speech);
            } else {
                document.getElementById('noVoiceMsg').style.display = 'block';
            }
        }
    </script>

</body>
</html>
