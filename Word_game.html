<!-- login.html -->
<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body { background:#0f172a; color:white; display:flex; justify-content:center; align-items:center; height:100vh; }
    .login-box { background:#1e293b; padding:30px; border-radius:15px; text-align:center; width:300px; }
    input { margin:10px 0; padding:10px; border-radius:8px; border:none; width:100%; }
    button { background:#38bdf8; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>ඇතුල් වන්න</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="msg"></p>
  </div>

  <script>
    function login() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const msg = document.getElementById('msg');

      if(user === "student" && pass === "1234") {
        window.location.href = "sinhala_pre.html"; // redirect to menu
      } else {
        msg.style.color = "red";
        msg.innerText = "වැරදි login! ❌";
      }
    }
  </script>
</body>
</html>

<!-- akuru_game.html -->
<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>අකුරු සෙල්ලම - පෙරපාසල</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', sans-serif; }
        body { background: #0f172a; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: #38bdf8; }
        .back-btn { background: #334155; color: white; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-weight: bold; }

        .game-card { background: #1e293b; border: 3px solid #38bdf8; border-radius: 20px; padding: 25px; text-align: center; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .target-letter { font-size: 4rem; color: #ff007f; margin: 15px 0; font-weight: bold; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .option-btn { background: #334155; border: 2px solid #fff; border-radius: 15px; padding: 15px; font-size: 2.5rem; cursor: pointer; transition: transform 0.2s; }
        .option-btn:active { transform: scale(0.9); }

        #msg { margin-top: 15px; font-size: 1.2rem; font-weight: bold; height: 30px; }
    </style>
</head>
<body>

    <header>
        <h2>🧩 අකුරු සෙල්ලම</h2>
        <a href="sinhala_pre.html" class="back-btn">⬅ Menu</a>
    </header>

    <div class="game-card">
        <p>මේ අකුරට ගැලපෙන පින්තූරය තෝරන්න:</p>
        <div class="target-letter">අ</div>

        <div class="options-grid">
            <button class="option-btn" onclick="checkAnswer(true)">🐘</button>
            <button class="option-btn" onclick="checkAnswer(false)">☀️</button>
            <button class="option-btn" onclick="checkAnswer(false)">⏰</button>
            <button class="option-btn" onclick="checkAnswer(false)">🍌</button>
        </div>

        <div id="msg"></div>
    </div>

    <script>
        function checkAnswer(isCorrect) {
            const msg = document.getElementById('msg');
            if(isCorrect) {
                msg.style.color = '#00e676';
                msg.innerText = "නිවැරදියි! හරිම ෂෝක්! 🎉";
            } else {
                msg.style.color = '#ef4444';
                msg.innerText = "ආයෙත් උත්සාහ කරන්න! ❌";
            }
        }
    </script>

</body>
</html>
