<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>සිංහල - පෙරපාසල</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Segoe UI', sans-serif; }

        body {
            background-color: #0f172a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* 🌸 මල් වත්ත Watermark Background */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://img.freepik.com/free-vector/hand-drawn-flower-garden-background_23-2148802220.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.12;
            z-index: -1;
            pointer-events: none;
        }

        header {
            width: 100%; max-width: 800px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; border-bottom: 3px dashed #ff416c; padding-bottom: 15px;
        }

        .title-area h1 { font-size: 2.2rem; color: #ff416c; text-shadow: 0 0 10px rgba(255, 65, 108, 0.5); }
        .back-btn { background: #334155; color: #fff; padding: 10px 18px; border-radius: 12px; text-decoration: none; font-weight: bold; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px; width: 100%; max-width: 800px;
        }

        .menu-btn {
            padding: 25px 15px; text-decoration: none; color: white; font-weight: bold;
            font-size: 1.2rem; text-align: center; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); border: 4px solid #fff;
            transition: transform 0.3s;
        }

        .menu-btn:hover { transform: scale(1.08); }

        .btn-hodiya { background: linear-gradient(135deg, #ff416c, #ff4b2b); border-radius: 30px; }
        .btn-tracing { background: linear-gradient(135deg, #f7b733, #fc4a1a); border-radius: 50%; width: 160px; height: 160px; justify-self: center; }
        .btn-game { background: linear-gradient(135deg, #11998e, #38ef7d); border-radius: 10px 50px 10px 50px; color: #000; }
        .btn-story { background: linear-gradient(135deg, #8a2387, #e94057); border-radius: 50px 10px 50px 10px; }

        .icon { font-size: 2.5rem; }

        .loading {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; font-size: 1.2rem; color: #94a3b8;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="loadingScreen" class="loading">පූරණය වෙමින්...</div>

    <div id="pageContent" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center;">

        <header>
            <div class="title-area">
                <h1>🌸 සිංහල අකුරු මණ්ඩපය</h1>
                <p>ආසාවෙන් සිංහල ඉගෙන ගනිමු!</p>
            </div>
            <a href="preschool.html" class="back-btn">⬅ ආපසු</a>
        </header>

        <div class="grid">
            <a href="sinhala_hodiya.html" class="menu-btn btn-hodiya">
                <span class="icon">🗣️</span>
                සිංහල හෝඩිය
            </a>

            <a href="sinhala_tracing.html" class="menu-btn btn-tracing">
                <span class="icon">🎨</span>
                අකුරු පාට කරමු
            </a>

            <a href="sinhala_game.html" class="menu-btn btn-game">
                <span class="icon">🧩</span>
                අකුරු සෙල්ලම
            </a>

            <a href="sinhala_stories.html" class="menu-btn btn-story">
                <span class="icon">📖</span>
                පුංචි කතන්දර
            </a>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_zzKyChOeDSJGmhd8j2clhGf0nXqdv4g",
            authDomain: "project-7974004196672383534.firebaseapp.com",
            projectId: "project-7974004196672383534",
            storageBucket: "project-7974004196672383534.firebasestorage.app",
            messagingSenderId: "635003004594",
            appId: "1:635003004594:web:98361476c6bca7a691cbab",
            measurementId: "G-7QDP5TC3HW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('pageContent').classList.remove('hidden');
            } else {
                window.location.href = "index.html";
            }
        });
    </script>

</body>
</html>
