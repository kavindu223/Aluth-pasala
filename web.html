<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>මගේ වෙබ් සයිට් එක</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #121212;
            color: #fff;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 { color: #00e676; }
        .btn {
            background: #00e676;
            color: #000;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>ආයුබෝවන්!</h1>
    <p>මම මේ වෙබ් සයිට් එක හැදුවේ මගේ ෆෝන් එකෙන්!</p>
    <a href="javascript:void(0)" class="btn">තවත් විස්තර</a>
</body>
</html>
