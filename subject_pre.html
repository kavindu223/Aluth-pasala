<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>පෙරපාසල - අලුත් පාසල</title>
    <!-- Puter.js - Free AI (backend/API key අවශ්‍ය නැත) -->
    <script src="https://js.puter.com/v2/"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Segoe UI', sans-serif; }

        body {
            background-color: #0f172a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://img.freepik.com/free-vector/cute-kids-school-seamless-pattern-background_23-2148658823.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.08;
            z-index: -1;
            pointer-events: none;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 3px dashed #ff007f;
            padding-bottom: 15px;
        }

        .title-area h1 { font-size: 2.2rem; color: #ff007f; text-shadow: 0 0 10px rgba(255, 0, 127, 0.5); }
        .title-area p { color: #f1f5f9; font-size: 1rem; }

        .top-icons { display: flex; gap: 10px; align-items: center; }

        .chat-msg-btn {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            border: none; color: #fff; padding: 10px 18px;
            border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(255, 0, 127, 0.4);
        }

        .back-btn {
            background: #334155; color: #fff; padding: 8px 15px;
            border-radius: 12px; text-decoration: none; font-weight: bold;
        }

        .container { width: 100%; max-width: 800px; margin-top: 20px; }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 25px;
            justify-items: center;
        }

        .subject-card {
            text-decoration: none; color: white; font-weight: bold;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: transform 0.3s, filter 0.3s;
            width: 140px; height: 140px; text-align: center;
        }

        .subject-card:hover { transform: scale(1.1) rotate(3deg); }

        .s-sinhala {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border-radius: 50%;
            border: 4px solid #fff;
        }

        .s-english {
            background: linear-gradient(135deg, #8a2387, #e94057);
            border-radius: 30px;
            border: 4px solid #fff;
        }

        .s-activities {
            background: linear-gradient(135deg, #f7b733, #fc4a1a);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            border: 4px solid #fff;
        }

        .s-environment {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            border-radius: 10px 60px 10px 60px;
            color: #000; border: 4px solid #fff;
        }

        .icon { font-size: 2.8rem; margin-bottom: 5px; }

        .ai-chatbot-btn {
            position: fixed; bottom: 20px; right: 20px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: 3px solid #fff; color: #fff; width: 65px; height: 65px;
            border-radius: 50%; font-size: 2rem; cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 114, 255, 0.6);
            display: flex; justify-content: center; align-items: center;
        }

        .popup {
            display: none; position: fixed; bottom: 95px; right: 20px;
            width: 310px; height: 390px; background: #1e293b;
            border: 3px solid #ff007f; border-radius: 20px;
            flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 100;
        }

        .popup-header { background: #0f172a; padding: 12px; display: flex; justify-content: space-between; border-radius: 17px 17px 0 0; }
        .popup-body { flex: 1; padding: 12px; overflow-y: auto; font-size: 0.9rem; }
        .popup-footer { padding: 10px; display: flex; gap: 6px; }
        .popup-footer input { flex: 1; padding: 8px; border-radius: 10px; border: none; background: #334155; color: white; }
        .popup-footer button { padding: 8px 14px; background: #00e676; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .popup-footer button:disabled { opacity: 0.5; cursor: not-allowed; }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-size: 1.2rem;
            color: #94a3b8;
        }

        .hidden { display: none; }

        .typing {
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="loadingScreen" class="loading">පූරණය වෙමින්...</div>

    <div id="pageContent" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center;">

        <header>
            <div class="title-area">
                <h1>🧸 පෙරපාසල</h1>
                <p>ආසාවෙන් ඉගෙන ගනිමු!</p>
            </div>
            <div class="top-icons">
                <button class="chat-msg-btn" onclick="togglePopup('userChat')">💬 Chat</button>
                <a href="home.html" class="back-btn">⬅ ආපසු</a>
            </div>
        </header>

        <div class="container">
            <div class="subject-grid">
                <a href="sinhala_pre.html" class="subject-card s-sinhala">
                    <span class="icon">📚</span>
                    සිංහල
                </a>

                <a href="english_pre.html" class="subject-card s-english">
                    <span class="icon">𝔄</span>
                    ඉංග්‍රීසි
                </a>

                <a href="activities_pre.html" class="subject-card s-activities">
                    <span class="icon">🎨</span>
                    ක්‍රියාකාරකම්
                </a>

                <a href="env_pre.html" class="subject-card s-environment">
                    <span class="icon">🌿</span>
                    පරිසරය
                </a>
            </div>
        </div>

        <button class="ai-chatbot-btn" onclick="togglePopup('aiChat')">🤖</button>

        <div id="userChat" class="popup">
            <div class="popup-header">
                <span>💬 පන්ති කාමර චැට් එක</span>
                <span style="cursor:pointer;" onclick="togglePopup('userChat')">✖</span>
            </div>
            <div class="popup-body" id="userChatBody">
                <p style="color:#aaa;">පෙරපාසල් යහළුවන් සමඟ චැට් කරන්න...</p>
            </div>
            <div class="popup-footer">
                <input type="text" id="userChatInput" placeholder="මැසේජ් එකක් ලියන්න...">
                <button onclick="sendUserMsg()">යවන්න</button>
            </div>
        </div>

        <div id="aiChat" class="popup" style="border-color:#00c6ff;">
            <div class="popup-header" style="background:#0072ff;">
                <span>🤖 AI සහායකයා</span>
                <span style="cursor:pointer;" onclick="togglePopup('aiChat')">✖</span>
            </div>
            <div class="popup-body" id="aiChatBody">
                <p style="color:#cbd5e1;">ආයුබෝවන්! මම AI සහායකයා. ඕනෑම දෙයක් අහන්න!</p>
            </div>
            <div class="popup-footer">
                <input type="text" id="aiInput" placeholder="ප්‍රශ්නයක් අහන්න...">
                <button id="askBtn" style="background:#00c6ff;" onclick="askAI()">අහන්න</button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_zzKyChOeDSJGmhd8j2clhGf0nXqdv4g",
            authDomain: "project-7974004196672383534.firebaseapp.com",
            projectId: "project-7974004196672383534",
            storageBucket: "project-7974004196672383534.firebasestorage.app",
            messagingSenderId: "635003004594",
            appId: "1:635003004594:web:98361476c6bca7a691cbab",
            measurementId: "G-7QDP5TC3HW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('pageContent').classList.remove('hidden');
            } else {
                window.location.href = "index.html";
            }
        });
    </script>

    <script>
        function togglePopup(id) {
            var el = document.getElementById(id);
            el.style.display = (el.style.display === 'flex') ? 'none' : 'flex';
        }

        function escapeHTML(str) {
            var div = document.createElement('div');
            div.innerText = str;
            return div.innerHTML;
        }

        function sendUserMsg() {
            var input = document.getElementById('userChatInput');
            var body = document.getElementById('userChatBody');
            if (input.value.trim() !== "") {
                body.innerHTML += `<p style="margin-top:8px; text-align:right; color:#00e676;"><b>ඔබ:</b> ${escapeHTML(input.value)}</p>`;
                input.value = "";
                body.scrollTop = body.scrollHeight;
            }
        }

        // 🤖 Real AI - Puter.js හරහා (API key/backend අවශ්‍ය නැත)
        const AI_SYSTEM_PROMPT = "ඔබ ශ්‍රී ලංකාවේ පෙරපාසල් දරුවෙකුට උදව් කරන මිත්‍රශීලී AI ගුරුවරයෙකි. සිංහල භාෂාවෙන් පමණක් උත්තර දෙන්න. උත්තර ඉතා කෙටි, සරල වචන වලින්, ධනාත්මක සහ අලංකාර ලෙස (emoji සමඟ) ලබා දෙන්න. දරුවෙකුට නුසුදුසු, බියජනක, හෝ සංකීර්ණ කිසිවක් කථා නොකරන්න. ප්‍රශ්නය පාඩම් හෝ ක්‍රීඩා ගැන නොවේ නම්, කරුණාවෙන් පාඩම් සම්බන්ධ දෙයකට යොමු කරන්න.";

        async function askAI() {
            var input = document.getElementById('aiInput');
            var body = document.getElementById('aiChatBody');
            var btn = document.getElementById('askBtn');
            var question = input.value.trim();

            if (question === "") return;

            body.innerHTML += `<p style="margin-top:8px; text-align:right; color:#00e676;"><b>ඔබ:</b> ${escapeHTML(question)}</p>`;
            input.value = "";
            btn.disabled = true;

            var typingEl = document.createElement('p');
            typingEl.className = 'typing';
            typingEl.innerText = 'AI ටයිප් කරමින්...';
            body.appendChild(typingEl);
            body.scrollTop = body.scrollHeight;

            try {
                const response = await puter.ai.chat([
                    { role: "system", content: AI_SYSTEM_PROMPT },
                    { role: "user", content: question }
                ]);

                typingEl.remove();

                const answer = (response && response.message && response.message.content)
                    ? response.message.content
                    : (typeof response === "string" ? response : "සමාවෙන්න, උත්තරයක් ලබාගන්න බැරි වුණා.");

                body.innerHTML += `<p style="margin-top:5px; color:#cbd5e1;"><b>AI:</b> ${escapeHTML(answer)}</p>`;
            } catch (err) {
                typingEl.remove();
                body.innerHTML += `<p style="margin-top:5px; color:#f87171;"><b>AI:</b> සමාවෙන්න, දැන් උත්තර දෙන්න බැහැ. ටිකක් පස්සේ නැවත try කරන්න. 🙏</p>`;
            } finally {
                btn.disabled = false;
                body.scrollTop = body.scrollHeight;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('userChatInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') sendUserMsg();
            });
            document.getElementById('aiInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') askAI();
            });
        });
    </script>

</body>
</html>
