<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <title>ALUTH PASALA - MASTER HACKER CONSOLE</title>
  <style>
    body { background-color: #050505; color: #00ff41; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 20px; }
    h1 { text-align: center; font-size: 24px; text-shadow: 0 0 10px #00ff41; border-bottom: 2px solid #00ff41; padding-bottom: 10px; }
    
    /* Hacker Terminal Style */
    .terminal { background: #000; border: 1px solid #333; padding: 15px; height: 180px; overflow-y: auto; font-size: 13px; margin-bottom: 20px; border-radius: 5px; }
    .log-entry { margin-bottom: 5px; color: #00ff41; }

    /* Dashboard Grid */
    .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    .card { background: #0a0a0a; border: 1px solid #00ff41; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 255, 65, 0.1); }
    
    .req-item { background: #111; padding: 15px; margin-bottom: 10px; border-left: 4px solid #00ff41; }
    
    button { background: #00ff41; color: #000; border: none; padding: 10px 15px; font-weight: bold; cursor: pointer; border-radius: 3px; margin-top: 10px; }
    button:hover { background: #fff; }
  </style>
</head>
<body>

  <h1>[>>] SYSTEM ACCESS GRANTED: MASTER ADMIN</h1>

  <!-- Hacker Logs -->
  <div class="terminal" id="hackerLogs">
    <div class="log-entry">> INITIALIZING FIREBASE...</div>
    <div class="log-entry">> ENCRYPTION LAYER: ACTIVE</div>
    <div class="log-entry">> MONITORING FOR NEW PAYMENT SLIPS...</div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>📥 PENDING PAYMENT VERIFICATION</h2>
      <div id="requestsList">Loading pending slips...</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    // 1. Security Check
    if (sessionStorage.getItem("adminAuthenticated") !== "true") {
      alert("UNAUTHORIZED! ACCESS DENIED.");
      window.location.href = "index.html";
    }

    // 2. Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyC_zzKyChOeDSJGmhd8j2clhGf0nXqdv4g",
        authDomain: "project-7974004196672383534.firebaseapp.com",
        projectId: "project-7974004196672383534",
        storageBucket: "project-7974004196672383534.firebasestorage.app",
        messagingSenderId: "635003004594",
        appId: "1:635003004594:web:98361476c6bca7a691cbab"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 3. Logger Function
    function addLog(msg) {
      const logs = document.getElementById("hackerLogs");
      logs.innerHTML += `<div class="log-entry">> ${msg}</div>`;
      logs.scrollTop = logs.scrollHeight;
    }

    // 4. Fetch Requests
    db.collection("requests").where("status", "==", "pending")
      .onSnapshot((snapshot) => {
        const list = document.getElementById("requestsList");
        list.innerHTML = "";
        if (snapshot.empty) list.innerHTML = "<p>No pending slips.</p>";

        snapshot.forEach((doc) => {
          const r = doc.data();
          list.innerHTML += `
            <div class="req-item">
              <p>USER: ${r.userEmail}</p>
              <p>GRADE: ${r.gradeId}</p>
              <button onclick="approve('${doc.id}', '${r.userEmail}', '${r.gradeId}')">[APPROVE ACCESS]</button>
            </div>
          `;
        });
      });

    // 5. Approve & 30-Day Expiry Logic
    function approve(reqId, email, grade) {
      addLog("VERIFYING PAYMENT FOR: " + email);
      
      // Calculate 30 days
      const expiryDate = new Date();
      expiryDate.setDate(expiryDate.getDate() + 30);
      
      db.collection("users").doc(email).set({
        access: {
          [grade]: {
            status: "active",
            valid_until: expiryDate.toISOString() 
          }
        }
      }, { merge: true }).then(() => {
        db.collection("requests").doc(reqId).update({ status: "approved" });
        addLog("SUCCESS: ACCESS GRANTED FOR 30 DAYS!");
        alert("Access granted to " + email);
      }).catch(err => addLog("ERROR: " + err.message));
    }
  </script>
</body>
</html>
