<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Control Center</title>
  <style>
    body { background-color: #0b0e14; color: #00ff88; font-family: monospace; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #00ff88; text-shadow: 0 0 10px #00ff88; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: #161b22; border: 1px solid #00ff88; border-radius: 8px; padding: 15px; box-shadow: 0 0 15px rgba(0,255,136,0.1); }
    .card h2 { margin-top: 0; border-bottom: 1px solid #00ff88; padding-bottom: 5px; color: #fff; }
    .req-box { background: #0d1117; border: 1px solid #30363d; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
    .btn { background: #00ff88; color: #000; border: none; padding: 8px 12px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 5px; }
    .btn-mail { background: #58a6ff; color: #fff; }
  </style>
</head>
<body>

  <h1>🛡️ ALUTH PASALA - MASTER ADMIN CONSOLE</h1>
  <p style="text-align: center; color: #aaa;">Logged in as: kavindumihiran2023@gmail.com</p>

  <div class="grid">
    <!-- Student Access Requests -->
    <div class="card">
      <h2>📥 Class Access Requests</h2>
      <div id="requestsList">
        <p style="color: #aaa;">පන්ති ඇතුළුවීම් ඉල්ලීම් පරීක්ෂා කරමින්...</p>
      </div>
    </div>

    <!-- Live System Logs -->
    <div class="card">
      <h2>📡 Live Activity & Messages</h2>
      <div id="activityLogs" style="height: 250px; overflow-y: auto; background: #0d1117; padding: 10px; border-radius: 5px;">
        <p style="color: #aaa;">සජීවී දත්ත සක්‍රියයි...</p>
      </div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    // Verify Security Authentication
    if (sessionStorage.getItem("adminAuthenticated") !== "true") {
      alert("⛔ UNAUTHORIZED ACCESS PREVENTED!");
      window.location.href = "index.html";
    }

    const firebaseConfig = {
      apiKey: "AIzaSyC_zzKyChOeDSJGmhd8j2clhGf0nXqdv4g",
      authDomain: "project-7974004196672383534.firebaseapp.com",
      projectId: "project-7974004196672383534",
      storageBucket: "project-7974004196672383534.firebasestorage.app",
      messagingSenderId: "635003004594",
      appId: "1:635003004594:web:98361476c6bca7a691cbab"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // Fetch Access Requests Real-time
    db.collection("requests").where("status", "==", "pending")
      .onSnapshot((snapshot) => {
        const list = document.getElementById("requestsList");
        list.innerHTML = "";

        if (snapshot.empty) {
          list.innerHTML = "<p style='color: #aaa;'>ඉල්ලීම් කිසිවක් නැත.</p>";
          return;
        }

        snapshot.forEach((doc) => {
          const req = doc.data();
          const id = doc.id;

          list.innerHTML += `
            <div class="req-box">
              <p>👤 <b>User:</b> ${req.userEmail}</p>
              <p>📚 <b>Grade:</b> ${req.gradeId}</p>
              <button class="btn" onclick="approveStudent('${id}', '${req.userEmail}', '${req.gradeId}')">GRANT ACCESS (30 DAYS)</button>
              <button class="btn btn-mail" onclick="sendGmailPaymentInfo('${req.userEmail}')">SEND GMAIL DETAILS</button>
            </div>
          `;
        });
      });

    function approveStudent(reqId, email, grade) {
      const expDate = new Date();
      expDate.setDate(expDate.getDate() + 30);

      db.collection("users").doc(email).set({
        access: {
          [grade]: {
            status: "active",
            expiresAt: firebase.firestore.Timestamp.fromDate(expDate)
          }
        }
      }, { merge: true }).then(() => {
        db.collection("requests").doc(reqId).update({ status: "approved" });
        alert(`✅ Approved ${email} for ${grade}`);
      });
    }

    function sendGmailPaymentInfo(email) {
      const mailtoUrl = `mailto:${email}?subject=Aluth Pasala - Class Access & Payment Info&body=Hello,%0D%0A%0D%0ATo get access to your requested class, please follow the payment instructions or reply to this email.%0D%0A%0D%0ABest regards,%0D%0AAluth Pasala Admin`;
      window.open(mailtoUrl, '_blank');
    }
  </script>
</body>
</html>
